name: Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DALAMUD_HOME: /tmp/dalamud

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p "$DALAMUD_HOME"
          curl -fsSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$DALAMUD_HOME"

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=continuous" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Continuous (${GITHUB_SHA:0:7})" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          fi

      - name: Restore
        run: dotnet restore VendingMachine.sln

      - name: Build
        run: >
          dotnet build VendingMachine/VendingMachine.csproj -c Release --no-restore
          -p:Version=${{ env.VERSION }}
          -p:AssemblyVersion=${{ env.VERSION }}.0

      - name: Pack plugin zip
        run: |
          cd VendingMachine/bin/Release
          zip -j VendingMachine.zip VendingMachine.dll VendingMachine.json ECommons.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: VendingMachine/bin/Release/VendingMachine.zip
          generate_release_notes: true
