name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  DALAMUD_HOME: /tmp/dalamud

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read version from VendingMachine.json
        run: |
          ASSEMBLY_VERSION=$(jq -r '.AssemblyVersion' VendingMachine/VendingMachine.json)
          if [[ -z "$ASSEMBLY_VERSION" || "$ASSEMBLY_VERSION" == "null" ]]; then
            echo "AssemblyVersion not found in VendingMachine/VendingMachine.json" >&2
            exit 1
          fi
          RELEASE_TAG="v${ASSEMBLY_VERSION}"
          IFS=. read -r major minor patch revision <<< "${ASSEMBLY_VERSION}"
          if [[ -n "$revision" ]]; then
            VERSION="${major}.${minor}.${patch}"
          else
            VERSION="${ASSEMBLY_VERSION}"
          fi
          echo "ASSEMBLY_VERSION=${ASSEMBLY_VERSION}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          mkdir -p "$DALAMUD_HOME"
          curl -fsSL https://goatcorp.github.io/dalamud-distrib/latest.zip -o /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$DALAMUD_HOME"

      - name: Restore
        run: dotnet restore VendingMachine.sln

      - name: Build
        run: >
          dotnet build VendingMachine/VendingMachine.csproj -c Release --no-restore
          -p:Version=${{ env.VERSION }}
          -p:AssemblyVersion=${{ env.ASSEMBLY_VERSION }}

      - name: Sync plugin manifest
        run: bash .github/scripts/sync-plugin-manifest.sh

      - name: Pack plugin zip
        run: |
          cd VendingMachine/bin/Release
          zip -j VendingMachine.zip VendingMachine.dll VendingMachine.json ECommons.dll

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          files: VendingMachine/bin/Release/VendingMachine.zip
          generate_release_notes: true
